<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Build Your Health!</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <header class="mb-4 text-center">
      <h1 class="text-primary">Build Your Health</h1>
      <p class="text-secondary">매일 건강한 물 섭취량과 수면 시간을 기록하세요!</p>
    </header>

    <div class="card mb-4">
      <div class="card-body">
        <h4 class="card-title">환영합니다, 사용자님!</h4>
        <p class="card-text">아래는 오늘의 건강 기록 예시입니다.</p>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <div class="card border-success">
          <div class="card-header bg-success text-white">오늘의 권장 물 섭취량</div>
          <div class="card-body">
            <p>권장 섭취량: <strong>2.0 L</strong></p>
            <p>남은 섭취량: <strong>0.6 L</strong></p>
            <div class="progress">
              <div class="progress-bar bg-info" style="width: 70%">70%</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card border-primary">
          <div class="card-header bg-primary text-white">오늘의 권장 수면 시간</div>
          <div class="card-body">
            <p>권장 수면 시간: <strong>8.0 시간</strong></p>
            <p>남은 수면 시간: <strong>1.5 시간</strong></p>
            <div class="progress">
              <div class="progress-bar bg-warning" style="width: 81%">81%</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center mt-5 border-top pt-3">
      <p class="text-muted">Build Your Health — 데모 페이지입니다.</p>
    </footer>
  </div>
</body>
</html>
